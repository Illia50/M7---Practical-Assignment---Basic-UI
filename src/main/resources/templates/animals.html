<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter — Add Animal</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    nav { background: #f1f5f9; padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #2563eb; }
    nav a:hover { text-decoration: underline; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 0.4rem; }
    form { display: grid; gap: 0.5rem; max-width: 480px; margin-top: 1rem; }
    label { font-weight: bold; }
    input, select, textarea { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 0.6rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; width: fit-content; }
    button:hover { background: #1d4ed8; }
    .back-link { display: inline-block; margin-top: 1rem; color: #2563eb; }
  </style>
</head>
<body>

<!-- Navigation — same on every page -->
<nav>
  <a th:href="@{/}">Home</a>
  <a th:href="@{/animals}">All animals</a>
  <a th:href="@{/animals/new}">Add animal</a>
</nav>

<main>
  <h1>Shelter Animals</h1>

  <section aria-label="Animal list">
    <p class="empty" th:if="${#lists.isEmpty(animals)}">No animals yet.</p>

    <ul th:unless="${#lists.isEmpty(animals)}">

      <li th:each="animal : ${animals}">

        <img th:src="@{${animal.imageUrl}}" th:alt="'Photo of ' + ${animal.name}" alt="Photo of animal">

        <div class="info">
          <strong th:text="${animal.name}">Name</strong>
          — <span th:text="${animal.type}">TYPE</span>
          | <span th:text="${animal.breed}">Breed</span>
          | Age: <span th:text="${animal.age}">0</span>

          <span th:text="${animal.status}"
                th:class="${animal.status.name() == 'AVAILABLE'} ? 'status-available' : 'status-adopted'">STATUS</span>

          <p th:text="${animal.description}">Description</p>

          <form th:if="${animal.status.name() == 'AVAILABLE'}"
                th:action="@{/animals/{id}/adopt(id=${animal.id})}" method="post">
            <button type="submit">Adopt</button>
          </form>
        </div>
      </li>
    </ul>
  </section>

  <a th:href="@{/animals/new}" class="cta">Add a new animal</a>
</main>

</body>
</html>
